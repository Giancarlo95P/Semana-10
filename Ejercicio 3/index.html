<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101421">
    <title>Prisma triangular | Transformación 3D</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main class="pagina">
        <header class="encabezado">
            <p class="etiqueta">CSS AVANZADO · EJERCICIO 3</p>
            <h1>Prisma <span>triangular</span></h1>
        </header>

        <section class="actividad" aria-labelledby="titulo-prisma">
            <div class="escenario" role="img" aria-label="Prisma triangular de cinco caras que gira en tres dimensiones">
                <div class="prisma">
                    <div class="cara triangulo triangulo-frente"><span>FRENTE</span></div>
                    <div class="cara triangulo triangulo-atras"><span>ATRÁS</span></div>
                    <div class="cara lateral lateral-izquierda"><span>LATERAL 1</span></div>
                    <div class="cara lateral lateral-base"><span>LATERAL 2</span></div>
                    <div class="cara lateral lateral-derecha"><span>LATERAL 3</span></div>
                </div>
            </div>

            <p class="nota-escenario">Pasa el cursor sobre la figura para pausar la rotación.</p>
        </section>
    </main>
</body>

</html>
